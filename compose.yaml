x-database-environment: &database-environment
  DB_HOST: mysql
  DB_USER: dashboard
  DB_NAME: dashboard
  DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}"
      MYSQL_DATABASE: dashboard
      MYSQL_USER: dashboard
      MYSQL_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
    volumes:
      - database:/var/lib/mysql
      - ./server/schema.sql:/docker-entrypoint-initdb.d/001-dashboard.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql --user=\"$$MYSQL_USER\" --password=\"$$MYSQL_PASSWORD\" \"$$MYSQL_DATABASE\" --execute='SELECT id FROM records LIMIT 0'"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  web:
    build: .
    environment:
      <<: *database-environment
      DASHBOARD_USER: "${DASHBOARD_USER:-dashboard}"
      DASHBOARD_PASSWORD: "${DASHBOARD_PASSWORD:?Set DASHBOARD_PASSWORD in .env}"
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
  reminders:
    build: .
    command: ["python3", "jobs/reminders.py"]
    environment: *database-environment
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  database:
